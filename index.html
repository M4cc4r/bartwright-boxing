<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bartwrights Boxing</title>
  <style>
    :root{
      --black:#0a0a0a;
      --dark:#121212;
      --grey:#8d8d8d;
      --light:#d9d9d9;
      --white:#f7f7f7;
      --line:#2b2b2b;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:Arial, Helvetica, sans-serif;
      background:var(--black);
      color:var(--white);
      min-height:100vh;
    }
    button{font:inherit}
    .page{
      min-height:100vh;
      background:
        radial-gradient(circle at 85% 12%, rgba(255,255,255,.08), transparent 28%),
        linear-gradient(135deg,#050505 0%,#111 55%,#070707 100%);
      overflow:hidden;
    }
    .hero{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:40px 20px;
      position:relative;
    }
    .glove{
      position:absolute;
      top:28px;
      right:32px;
      width:92px;
      height:92px;
      opacity:.9;
      transform:rotate(8deg);
    }
    .glove svg{width:100%;height:100%}
    .hero-inner{max-width:850px}
    .eyebrow{
      letter-spacing:7px;
      color:#aaa;
      font-size:12px;
      font-weight:700;
      margin-bottom:18px;
    }
    h1{
      font-size:clamp(42px,8vw,86px);
      line-height:.95;
      font-weight:950;
      letter-spacing:-4px;
      text-transform:uppercase;
    }
    .hero-rule{
      width:90px;height:5px;background:var(--white);
      margin:25px auto 24px;
    }
    .hero-glove{
      width:80px;height:80px;margin:0 auto 30px;
      filter:drop-shadow(0 10px 20px rgba(0,0,0,.5));
    }
    .hero-glove svg{width:100%;height:100%}
    .subtitle{
      color:#999;
      font-size:14px;
      letter-spacing:3px;
      text-transform:uppercase;
      margin-bottom:34px;
    }
    .primary-btn,.weight-btn,.back-btn{
      border:1px solid #555;
      background:#eee;
      color:#080808;
      padding:17px 30px;
      border-radius:3px;
      font-weight:900;
      letter-spacing:2px;
      cursor:pointer;
      transition:.2s ease;
      text-transform:uppercase;
    }
    .primary-btn:hover,.weight-btn:hover{
      background:white;
      transform:translateY(-3px);
      box-shadow:0 12px 30px rgba(255,255,255,.12);
    }
    .section{
      min-height:100vh;
      padding:90px 20px 70px;
      max-width:1050px;
      margin:auto;
      display:none;
    }
    .section.active{display:block;animation:fade .35s ease}
    @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .section-head{text-align:center;margin-bottom:55px}
    .section-kicker{
      color:#888;font-size:12px;letter-spacing:5px;font-weight:800;
      margin-bottom:13px;text-transform:uppercase;
    }
    .section h2{
      font-size:clamp(35px,6vw,62px);
      letter-spacing:-2px;
      text-transform:uppercase;
    }
    .weight-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:16px;
      max-width:850px;
      margin:auto;
    }
    .weight-btn{
      min-height:150px;
      background:#151515;
      color:white;
      border:1px solid #343434;
      position:relative;
      text-align:left;
      padding:25px;
    }
    .weight-btn span{
      display:block;color:#777;font-size:11px;letter-spacing:3px;margin-bottom:28px;
    }
    .weight-btn strong{font-size:21px;letter-spacing:1px}
    .weight-btn:after{
      content:"→";position:absolute;right:22px;bottom:19px;color:#777;font-size:25px;
    }
    .rank-section{padding-top:65px}
    .rank-top{
      display:flex;align-items:end;justify-content:space-between;gap:20px;
      margin-bottom:35px;
    }
    .rank-top h2{font-size:clamp(34px,6vw,58px);letter-spacing:-2px;text-transform:uppercase}
    .back-btn{
      background:transparent;color:#ddd;border-color:#333;padding:12px 18px;font-size:11px;
    }
    .rank-list{
      border-top:1px solid var(--line);
      max-width:900px;
      margin:auto;
    }
    .rank-row{
      display:grid;
      grid-template-columns:78px 1fr auto;
      align-items:center;
      gap:18px;
      min-height:76px;
      border-bottom:1px solid var(--line);
      padding:10px 12px;
      background:rgba(255,255,255,.015);
    }
    .rank-row:hover{background:rgba(255,255,255,.055)}
    .rank-num{
      color:#777;font-size:13px;font-weight:900;letter-spacing:2px;
    }
    .fighter{font-size:17px;font-weight:800;letter-spacing:.2px}
    .record{color:#888;font-size:13px;font-weight:700;letter-spacing:1px}
    .champion{
      display:grid;
      grid-template-columns:78px 1fr auto;
      border:1px solid #555;
      background:#eee;
      color:#080808;
      margin-bottom:12px;
      min-height:86px;
      padding:12px;
      align-items:center;
    }
    .champion .rank-num{color:#555}
    .champion .record{color:#555}
    .empty-record{color:#777}
    .official{
      text-align:center;color:#777;font-size:11px;letter-spacing:2px;
      text-transform:uppercase;margin-top:28px;
    }
    .home-link{
      display:block;text-align:center;margin-top:50px;
      color:#777;text-decoration:none;font-size:11px;letter-spacing:2px;
      text-transform:uppercase;cursor:pointer;
    }
    @media(max-width:700px){
      .glove{width:65px;height:65px;right:15px;top:18px}
      .weight-grid{grid-template-columns:1fr}
      .weight-btn{min-height:120px}
      .rank-row,.champion{grid-template-columns:52px 1fr}
      .record{grid-column:2}
      .fighter{font-size:15px}
      .rank-top{align-items:start;flex-direction:column}
      h1{letter-spacing:-2px}
    }
  </style>
</head>
<body>
<div class="page">

  <div class="hero" id="home">
    <div class="glove" aria-hidden="true">
      <svg viewBox="0 0 100 100" fill="none">
        <path d="M33 76c-5-5-7-12-5-19l8-25c1-4 5-6 8-4 3 1 4 5 3 8l-2 7 6-22c1-4 5-6 8-5 4 1 5 5 4 9l-4 18 5-19c1-4 5-6 8-5 4 1 5 5 4 9l-5 20 5-14c1-4 5-5 8-3 3 2 4 5 3 9l-8 29c-3 10-12 17-23 17H46c-5 0-10-2-13-5Z" fill="#d8d8d8" stroke="#777" stroke-width="3"/>
        <path d="M43 61c8 7 19 8 29 4" stroke="#555" stroke-width="4" stroke-linecap="round"/>
        <path d="M51 47l-4 15M62 44l-4 17M73 46l-5 15" stroke="#777" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="hero-inner">
      <div class="eyebrow">THE HOME OF THE FIGHTERS</div>
      <h1>BARTWRIGHTS<br>BOXING</h1>
      <div class="hero-rule"></div>
      <div class="hero-glove">
        <svg viewBox="0 0 100 100" fill="none">
          <path d="M33 76c-5-5-7-12-5-19l8-25c1-4 5-6 8-4 3 1 4 5 3 8l-2 7 6-22c1-4 5-6 8-5 4 1 5 5 4 9l-4 18 5-19c1-4 5-6 8-5 4 1 5 5 4 9l-5 20 5-14c1-4 5-5 8-3 3 2 4 5 3 9l-8 29c-3 10-12 17-23 17H46c-5 0-10-2-13-5Z" fill="#ddd" stroke="#666" stroke-width="3"/>
          <path d="M43 61c8 7 19 8 29 4" stroke="#555" stroke-width="4" stroke-linecap="round"/>
          <path d="M51 47l-4 15M62 44l-4 17M73 46l-5 15" stroke="#777" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="subtitle">Rankings • Records • Fighters</div>
      <button class="primary-btn" onclick="showSection('weights')">Rankings &amp; Records</button>
    </div>
  </div>

  <section class="section" id="weights">
    <div class="section-head">
      <div class="section-kicker">Bartwrights Boxing</div>
      <h2>Weight Classes</h2>
    </div>
    <div class="weight-grid">
      <button class="weight-btn" onclick="showRanking('heavy')">
        <span>01 / DIVISION</span><strong>Heavy Weight</strong>
      </button>
      <button class="weight-btn" onclick="showRanking('middle')">
        <span>02 / DIVISION</span><strong>Middle Weight</strong>
      </button>
      <button class="weight-btn" onclick="showRanking('light')">
        <span>03 / DIVISION</span><strong>Light Weight</strong>
      </button>
    </div>
    <div class="official">Refereed by Cody Hopley &amp; Noah Mac</div>
    <a class="home-link" onclick="showSection('home')">← Back to Bartwrights Boxing</a>
  </section>

  <section class="section rank-section" id="ranking">
    <div class="rank-top">
      <div>
        <div class="section-kicker">Bartwrights Boxing / Rankings</div>
        <h2 id="ranking-title">Heavy Weight</h2>
      </div>
      <button class="back-btn" onclick="showSection('weights')">← Weight Classes</button>
    </div>
    <div class="rank-list" id="rank-list"></div>
    <div class="official">Refereed by Cody Hopley &amp; Noah Mac</div>
    <a class="home-link" onclick="showSection('weights')">← Back to Weight Classes</a>
  </section>
</div>

<script>
const rankings = {
  heavy: {
    title: "Heavy Weight",
    fighters: [
      ["Champion","Vacant",""],
      ["1",'Fin "D" Drakeley',"4-0-0"],
      ["2","Harry Fellows","2-0-0"],
      ["3",'Fin "Gabz" Gabriel',"3-0-1"],
      ["4","Noah Mcgeown","2-0-0"],
      ["5",'Harry "Bart" Cartwright',"2-0-1"],
      ["6",'Archie "Burch" Bertram',"1-0-1"],
      ["7","Ubayd Nayeem","0-0-1"],
      ["8",'Max "MD" Drury',"0-0-1"],
      ["9",'Josh "Jabba" Jones',"0-0-2"],
      ["10","Eddie Matthews","0-0-2"],
      ["11",'Isaac "Deebs" Deeble',"0-0-2"]
    ]
  },
  middle: {
    title: "Middle Weight",
    fighters: [
      ["Champion","Vacant",""],
      ["1",'Zach "Scouse" Horton',"3-0-1"],
      ["2",'Archie "Bald" Vickarage',"2-1-0"],
      ["3",'Luke "Two Stroke" Tracey',"1-1-0"],
      ["4",'Ethan "Whitt" Whittle',"0-1-1"],
      ["5","Zain Mohammed","0-0-1"],
      ["6",'Harry "HS" Sam',"0-0-2"],
      ["7",'Azhari "AZ" Scrivens',"0-0-2"]
    ]
  },
  light: {
    title: "Light Weight",
    fighters: [
      ["Champion","Vacant",""],
      ["1",'Olly "Barris" Harris',"4-1-0"],
      ["2","Callum Humphries","2-0-2"],
      ["3",'Fraser "Fraz" Evans',"2-1-0"],
      ["4","Greyson Hewitt","1-0-1"],
      ["5",'Elliot "Proper" Court',"1-0-1"],
      ["6",'"Doctor" Alex Garner',"1-0-1'],
      ["7",'Lucian "Loosh" Daves',"1-0-0"],
      ["8",'Joe "Chan" Chandler',"0-0-1"],
      ["9","Leo Gibbs","0-0-1"],
      ["10",'Ashton "Rayman" Woodfield',""],
      ["11","Jake Badham","0-0-2"]
    ]
  }
};

function showSection(id){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById("home").style.display = id === "home" ? "flex" : "none";
  if(id !== "home") document.getElementById(id).classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
}

function showRanking(weight){
  const data = rankings[weight];
  document.getElementById("ranking-title").textContent = data.title;
  const list = document.getElementById("rank-list");
  list.innerHTML = data.fighters.map((f,i)=>{
    if(i===0){
      return `<div class="champion">
        <div class="rank-num">C</div>
        <div class="fighter"><strong>${f[1]}</strong></div>
        <div class="record">${f[2]}</div>
      </div>`;
    }
    return `<div class="rank-row">
      <div class="rank-num">${f[0].padStart(2,"0")}</div>
      <div class="fighter">${f[1]}</div>
      <div class="record ${!f[2]?'empty-record':''}">${f[2] || "—"}</div>
    </div>`;
  }).join("");
  showSection("ranking");
}
</script>
</body>
</html>
